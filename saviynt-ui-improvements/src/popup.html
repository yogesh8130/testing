<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Saviynt UI Improvements</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<header>
		<strong>Tab management</strong>
		<span id="state-label" class="state">Enabled</span>
	</header>
	<label class="setting">
		<span>
			<strong>Open beside active tab</strong>
			<small>Position new tabs next to the tab in use.</small>
		</span>
		<input id="tab-manager-enabled" type="checkbox" role="switch">
	</label>
	<footer>
		<button id="open-options" type="button">All settings</button>
	</footer>
	<script src="popup.js"></script>
</body>
</html>
